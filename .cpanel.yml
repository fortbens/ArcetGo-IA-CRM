---
deployment:
  tasks:
    # 1. Configuração dos diretórios no cPanel HomeHost
    - export ROOT_DIR=${HOME}/public_html
    - export CRM_DIR=${HOME}/public_html/aicrm
    - /bin/mkdir -p ${ROOT_DIR}
    - /bin/mkdir -p ${CRM_DIR}

    # 2. Implantação da Landing Page Institucional na Raiz (acertgo.com.br)
    # Impede absolutamente o erro "Index of /" e fornece o portal institucional oficial
    - /bin/cp root-site/index.html ${ROOT_DIR}/index.html 2>/dev/null || true
    - /bin/cp root-site/.htaccess ${ROOT_DIR}/.htaccess 2>/dev/null || true

    # 3. Configura o .htaccess exclusivo do CRM (SPA, HTTPS e no-cache estrito)
    - /bin/cp public/.htaccess-crm ${CRM_DIR}/.htaccess 2>/dev/null || true

    # 4. Copia os arquivos compilados do CRM para a pasta do subdomínio (public_html/aicrm/)
    - |
      if [ -d "dist-crm" ] && [ "$(ls -A dist-crm 2>/dev/null)" ]; then
        /bin/cp -R dist-crm/* ${CRM_DIR}/
        echo "Sucesso: CRM AcertGo implantado em ${CRM_DIR} e Site Institucional ativo em ${ROOT_DIR}."
      elif [ -d "dist" ] && [ "$(ls -A dist 2>/dev/null)" ]; then
        /bin/cp -R dist/* ${CRM_DIR}/
        /bin/cp public/.htaccess-crm ${CRM_DIR}/.htaccess 2>/dev/null || true
        echo "Sucesso: CRM AcertGo implantado em ${CRM_DIR} e Site Institucional ativo em ${ROOT_DIR}."
      else
        echo "Aviso: Pasta de compilação dist-crm não encontrada no Git. Suba os arquivos do CRM para public_html/aicrm/."
      fi
    - exit 0
