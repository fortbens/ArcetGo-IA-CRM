name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
      - master
      - principal
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build application with Firebase Secrets
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm run build

      # ATENÇÃO DE SEGURANÇA:
      # O deploy para o site principal (raiz) deve conter apenas o site institucional da Fortbens.
      # O código do CRM AcertGo é destinado exclusivamente ao subdomínio (public_html/aicrm/).
      # Caso utilize Firebase Hosting para o CRM, aponte para um subdomínio/site secundário dedicado (ex: aicrm).
      - name: Deploy to Firebase Hosting (Service Account)
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0219105645 || secrets.FIREBASE_SERVICE_ACCOUNT }}
        if: ${{ env.SERVICE_ACCOUNT != '' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ env.SERVICE_ACCOUNT }}
          channelId: live
          projectId: gen-lang-client-0219105645
          target: gen-lang-client-0219105645

      - name: Deploy to Firebase Hosting (Token Fallback)
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0219105645 || secrets.FIREBASE_SERVICE_ACCOUNT }}
          FB_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        if: ${{ env.FB_TOKEN != '' && env.SERVICE_ACCOUNT == '' }}
        run: npx firebase-tools deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}" --project gen-lang-client-0219105645

      - name: Aviso de Deploy Firebase (Segredos Não Configurados)
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0219105645 || secrets.FIREBASE_SERVICE_ACCOUNT }}
          FB_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        if: ${{ env.SERVICE_ACCOUNT == '' && env.FB_TOKEN == '' }}
        run: |
          echo "=========================================================================="
          echo "ℹ️ SUCESSO NO BUILD! O CRM AcertGo foi compilado perfeitamente na pasta dist/."
          echo "Lembrete: O deploy na raiz (public_html/ ou site principal) é exclusivo do site da Fortbens."
          echo "O CRM AcertGo deve ser hospedado no subdomínio aicrm (public_html/aicrm/)."
          echo "=========================================================================="
