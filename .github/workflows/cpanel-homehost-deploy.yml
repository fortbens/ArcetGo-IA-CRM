name: Deploy Automático cPanel HomeHost (FTP)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: cpanel-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Compilar e Sincronizar com cPanel
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências
        run: npm install --legacy-peer-deps

      - name: Compilar Projeto (Vite & TypeScript)
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Preparar Pacotes de Deploy (Raiz Institucional e Subdomínio CRM)
        run: |
          # 1. Garantir que dist-root e raiz-dist tenham a landing page institucional e o .htaccess anti-Index-of
          rm -rf dist-root raiz-dist
          mkdir -p dist-root raiz-dist
          cp -r root-site/. dist-root/
          cp -r root-site/. raiz-dist/

          # 2. Garantir que dist-crm tenha a aplicação completa do CRM e o .htaccess dedicado
          rm -rf dist-crm
          cp -r dist dist-crm
          cp public/.htaccess-crm dist-crm/.htaccess

      # 1. Sincronizar Landing Page Institucional para a Raiz (acertgo.com.br / public_html)
      - name: Sincronizar Site Institucional para Raiz (public_html/)
        env:
          FTP_SERVER: ${{ secrets.CPANEL_FTP_SERVER }}
          FTP_USER: ${{ secrets.CPANEL_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.CPANEL_FTP_PASSWORD }}
        if: ${{ env.FTP_SERVER != '' && env.FTP_USER != '' && env.FTP_PASS != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          server-dir: 'public_html/'
          local-dir: './dist-root/'
          state-name: '.ftp-deploy-sync-state-root.json'
          dangerous-clean-slate: false
          timeout: 60000
          log-level: verbose
          security: loose

      # 2. Sincronizar CRM / ERP para o Subdomínio (aicrm.acertgo.com.br / public_html/aicrm)
      - name: Sincronizar CRM para Subdomínio (public_html/aicrm/)
        env:
          FTP_SERVER: ${{ secrets.CPANEL_FTP_SERVER }}
          FTP_USER: ${{ secrets.CPANEL_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.CPANEL_FTP_PASSWORD }}
        if: ${{ env.FTP_SERVER != '' && env.FTP_USER != '' && env.FTP_PASS != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.CPANEL_FTP_SERVER }}
          username: ${{ secrets.CPANEL_FTP_USERNAME }}
          password: ${{ secrets.CPANEL_FTP_PASSWORD }}
          server-dir: 'public_html/aicrm/'
          local-dir: './dist-crm/'
          state-name: '.ftp-deploy-sync-state-crm.json'
          dangerous-clean-slate: false
          timeout: 60000
          log-level: verbose
          security: loose

      - name: Aviso de Deploy cPanel (Segredos Não Configurados)
        env:
          FTP_SERVER: ${{ secrets.CPANEL_FTP_SERVER }}
          FTP_USER: ${{ secrets.CPANEL_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.CPANEL_FTP_PASSWORD }}
        if: ${{ env.FTP_SERVER == '' || env.FTP_USER == '' || env.FTP_PASS == '' }}
        run: |
          echo "=========================================================================="
          echo "ℹ️ SUCESSO NO BUILD!"
          echo "  - dist-root/: Site institucional para public_html/ (acertgo.com.br)"
          echo "  - dist-crm/: Aplicação CRM para public_html/aicrm/ (aicrm.acertgo.com.br)"
          echo "Para ativar o envio automático via FTP para sua hospedagem cPanel Homehost,"
          echo "configure os seguintes segredos no repositório GitHub (Settings -> Secrets and variables -> Actions):"
          echo "  - CPANEL_FTP_SERVER (ex: ftp.seudominio.com.br ou IP do servidor)"
          echo "  - CPANEL_FTP_USERNAME (ex: usuario_cpanel ou conta FTP)"
          echo "  - CPANEL_FTP_PASSWORD (senha da conta FTP)"
          echo "=========================================================================="
